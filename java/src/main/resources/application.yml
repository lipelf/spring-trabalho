server:
  # o Railway informa a porta pela variavel PORT; localmente fica a 8080
  port: ${PORT:8080}

spring:
  application:
    name: soundhub
  datasource:
    # 5437: porta do container no docker-compose, escolhida para nao conflitar
    # com um PostgreSQL instalado direto na maquina (que costuma ocupar a 5432)
    url: ${DB_URL:jdbc:postgresql://localhost:5437/soundhub}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123}   # cada um pode trocar pela variavel de ambiente DB_PASSWORD
  jpa:
    hibernate:
      ddl-auto: validate   # quem cria/altera tabela e o Flyway, nunca o Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # chave em Base64 (minimo 256 bits). Em producao, sobrescrever com a variavel JWT_SECRET
  secret: ${JWT_SECRET:c291bmRodWItY2hhdmUtc2VjcmV0YS1kZS1kZXNlbnZvbHZpbWVudG8tbWluaW1vLTI1Ni1iaXRzLW9r}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h

ia:
  gemini:
    # Chave gratuita em https://aistudio.google.com/apikey. Sem ela a API sobe normalmente
    # e as rotas /ia respondem 503 ("IA nao configurada").
    api-key: ${GEMINI_API_KEY:}
    # Endpoint do Gemini compativel com a API da OpenAI (por isso o langchain4j-open-ai serve)
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
    modelo: ${GEMINI_MODELO:gemini-flash-lite-latest}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.soundhub: ${LOG_LEVEL:DEBUG}   # em producao, LOG_LEVEL=INFO
